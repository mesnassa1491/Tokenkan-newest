<style>
  :root{
    --ink:#0C2A22; --green:#0E3D2F; --gold:#B0872F; --gold-ink:#8A6A22;

    --bg:#F4F2ED; --pos:#157A56; --neg:#C0392B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#E7E4DC;font-family:'IBM Plex Sans',system-ui,sans-serif}
  a{color:var(--green)} a:hover{color:var(--gold)}
  ::-webkit-scrollbar{width:0;height:0}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}

  /* ── iOS device frame ─────────────────────────────────────── */
  .device{
    width:402px;height:874px;border-radius:48px;overflow:hidden;position:relative;
    background:#F2F2F7;box-shadow:0 40px 80px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.12);
    font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  }
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000;z-index:50}
  .statusbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:154px;align-items:center;justify-content:center;padding:21px 24px 19px;width:100%}
  .statusbar > div{flex:1;height:22px;display:flex;align-items:center;justify-content:center}
  .sb-time{font-family:-apple-system,'SF Pro',system-ui;font-weight:590;font-size:17px;line-height:22px;color:#000}
  .sb-icons{gap:7px;padding-top:1px;padding-right:1px}
  .home-ind{position:absolute;bottom:0;left:0;right:0;z-index:60;height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;pointer-events:none}
  .home-ind > div{width:139px;height:5px;border-radius:100px;background:rgba(0,0,0,.25)}

  /* ── app shell ────────────────────────────────────────────── */
  .app{position:relative;height:100%;background:var(--bg);color:var(--ink);
       font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
  .scroll{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

  /* ── shared bits ──────────────────────────────────────────── */
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px}
  .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lbl-sm{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lbl-xs{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .sec{margin:18px 20px 8px}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:2px 5px;border-radius:4px}
  .badge-lg{padding:3px 6px;border-radius:5px}
  .row-b{border-bottom:1px solid var(--hair)}
  .iconbtn{width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cta{background:var(--green);color:#fff;text-align:center;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;padding:16px}
  .screen{padding:62px 0 108px}
  .h1{font-size:24px;font-weight:600;letter-spacing:-.015em}
  .barrier{position:absolute;left:0;right:0;bottom:0;background:rgba(244,242,237,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .key{padding:15px 0;text-align:center;font-size:21px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:13px;cursor:pointer;user-select:none}

  /* press states (the prototype's style-active) */
  .t95:active{transform:scale(.95)} .t96:active{transform:scale(.96)}
  .t97:active{transform:scale(.97)} .t98:active{transform:scale(.98)}
  .t99:active{transform:scale(.99)} .tkey:active{background:#EDEAE1}

  input[type=range]{width:100%;margin-top:14px;accent-color:var(--green)}
  input[type=text]{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:var(--ink);
    background:transparent;border:0;outline:0;width:100%;padding:0}
  input[type=text]::placeholder{color:var(--faint)}

  .dot-typing::after{content:'▍';animation:tkBlink 1s steps(2) infinite;color:var(--faint)}

  @keyframes tkUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes tkFade{from{opacity:0}to{opacity:1}}
  @keyframes tkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes tkBlink{50%{opacity:0}}
</style>

// positions under asset ids that no longer exist. Left in place they resolve
// to null and take the whole render down, so a stale save is discarded for a
// fresh demo book rather than leaving the app in a broken half-state.
(function dropStaleHoldings(){
  var stale = Object.keys(book.holdings || {}).filter(function(id){ return !assetById(id); });
  if (!stale.length) return;
  book = seedBook();
  saveBook();

function loadBook(){
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.wallet === 'number' && parsed.holdings) return parsed;
    }
  } catch (e) { /* fall through to seed */ }
  return seedBook();
}
function saveBook(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(book)); } catch (e) {}
}
function resetBook(){
  book = seedBook();
  saveBook();
}

  tab:'home', screen:null, stack:[], assetId:'gl', hide:false,
  filter:'All', buyStep:'entry', amount:'500', ack:false,
  sellQty:12, doneKind:null, doneRows:null, doneMeta:null,

var pendingMsgScroll = false;

function setState(patch){ Object.assign(state, patch); render(); }
function asset(){ for (var i=0;i<ASSETS.length;i++) if (ASSETS[i].id===state.assetId) return ASSETS[i]; return ASSETS[0]; }
function assetById(id){ for (var i=0;i<ASSETS.length;i++) if (ASSETS[i].id===id) return ASSETS[i]; return null; }

function fmt(n){ return n.toLocaleString('en-MY', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function rm(n){ return 'RM ' + fmt(n); }
function round2(n){ return Math.round(n * 100) / 100; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── dates ────────────────────────────────────────────────────── */

// A virtual "now" the demo can fast-forward (see book.clockOffsetMs) so
// coupon distributions can be shown arriving without a real multi-month wait.
function today(){ var d = new Date(Date.now() + (book.clockOffsetMs || 0)); d.setHours(0,0,0,0); return d; }
function shortDate(d){ return String(d.getDate()).padStart(2,'0') + ' ' + MONTHS[d.getMonth()]; }
function longDate(d){ return String(d.getDate()).padStart(2,'0') + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function daysUntil(iso){
  var target = new Date(iso + 'T00:00:00');
  return Math.max(0, Math.ceil((target - today()) / 86400000));
}

// The real distribution schedule for an offering, built from its first payment
// date (ASSETS[].nextPayout) stepped semi-annually to maturity. Every offering
// is a bullet: years × 2 payments, the last one landing on the maturity date
// together with the nominal value. Row counts match the schedules printed in
// the prospectuses.
function payoutSchedule(a, perToken){
  var first = new Date(a.nextPayout + 'T00:00:00');
  var n = a.years * 2;
  var now = today();
  var rows = [];
  for (var i = 0; i < n; i++) {
    var d = new Date(first.getFullYear(), first.getMonth() + i * 6, first.getDate());
    var last = (i === n - 1);
    var status, dot;
    if (last)          { status = 'Maturity'; dot = '#DDD8CC'; }
    else if (d < now)  { status = 'Paid';     dot = '#157A56'; }
    else if (!rows.some(function(r){ return r.status === 'Next'; })) { status = 'Next'; dot = '#B0872F'; }
    else               { status = 'Scheduled'; dot = '#DDD8CC'; }
    rows.push({
      date: longDate(d),
      amt: rm(last ? round2(PAR + perToken) : perToken),
      status: status,
      dot: dot
    });
  }
  return rows;
}
function payoutLabel(iso){
  var d = new Date(iso + 'T00:00:00');
  return longDate(d);
}

/* ═══════════════════════════════════════════════════════════════
   Portfolio maths — everything below is derived from `book`
   ═══════════════════════════════════════════════════════════════ */

// Only ids that still map to a live offering — a holding under an unknown id
// would otherwise resolve to null downstream and throw mid-render.
function heldIds(){
  return Object.keys(book.holdings).filter(function(id){
    return book.holdings[id] > 0 && assetById(id);
  });
}
function tokensOf(id){ return book.holdings[id] || 0; }
function positionValue(id){ var a = assetById(id); return a ? tokensOf(id) * a.price : 0; }
function positionCost(id){ return tokensOf(id) * PAR; }
function semiAnnualPayout(id){
  var a = assetById(id);
  return a ? round2(tokensOf(id) * PAR * (a.rateNum / 100) / 2) : 0;
}
function accruedPerToken(id){
  var a = assetById(id);
  return a ? PAR * (a.rateNum / 100) * (ACCRUAL_DAYS / 365) : 0;
}

// asset.maturity is a display string ('15 Aug 2033'), not ISO — parse it locally.
function parseDMY(str){
  var parts = str.trim().split(' ');
  return new Date(parseInt(parts[2], 10), MONTHS.indexOf(parts[1]), parseInt(parts[0], 10));
}
function daysToMaturity(a){
  return Math.max(0, Math.ceil((parseDMY(a.maturity) - today()) / 86400000));
}

// Coupon income received to date on one holding — summed from the activity
// log rather than tracked separately, so it always matches what Activity shows.
function assetIncomeReceived(id){
  var a = assetById(id);
  if (!a) return 0;
  var total = 0;
  book.activity.forEach(function(t){
    if (t.kind === 'in' && t.sub === a.name) total += t.amount;
  });
  return round2(total);
}

// A small, deterministic bid ladder for visual "there is real demand" context.
// It does not drive the actual quote — sellQuote() below is the only pricing
// source of truth — so re-rendering never changes it mid-session.
function bidDepth(a){
  var seed = a.id.split('').reduce(function(s, c){ return s + c.charCodeAt(0); }, 7);
  var rows = [];
  for (var i = 0; i < 4; i++){
    rows.push({ price: round2(a.price - i * 0.05), qty: 15 + ((seed * (i + 4)) % 95) });
  }
  return rows;
}

// The next payout date for a holding. ASSETS[].nextPayout is the static seed
// value; once a coupon has actually been credited, book.payoutDates overrides
// it with the following period so the countdown keeps moving.
function nextPayoutOf(id){
  var a = assetById(id);
  if (!a) return null;
  return book.payoutDates[id] || a.nextPayout;
}
function addMonths(iso, n){
  var d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Automatic coupon distribution: any holding whose payout date has arrived is
// credited immediately — to the wallet and to the withdrawable income pool —
// with no manual claim step. Advances that holding's payout to the next
// period (semi-annual, matching every offering's freq in this dataset) and
// queues a toast per credited payment. Safe to call on every load/render;
// it's a no-op unless a date has actually passed.
function checkAndCreditDistributions(){
  var credited = [];
  heldIds().forEach(function(id){
    var guard = 0;
    while (nextPayoutOf(id) <= isoOf(today()) && guard < 12) {
      guard++;
      var a = assetById(id);
      var amt = semiAnnualPayout(id);
      if (amt > 0) {
        book.wallet = round2(book.wallet + amt);
        book.distributions = round2(book.distributions + amt);
        logActivity({ glyph:'↓', kind:'in', title:'Distribution received', sub:a.name, amount:amt });
        credited.push({ name:a.short, amount:amt });
      }
      book.payoutDates[id] = addMonths(nextPayoutOf(id), 6);
    }
  });
  if (credited.length) saveBook();
  return credited;
}
function isoOf(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ═══════════════════════════════════════════════════════════════
   Bond metrics & the AI explainer's fact sheet — one source of truth
   shared by the on-screen card and the /api/ask prompt payload.
   ═══════════════════════════════════════════════════════════════ */

function daysToYearsMonths(days){
  var y = Math.floor(days / 365);
  var m = Math.round((days % 365) / 30);
  if (m === 12) { y += 1; m = 0; }
  var parts = [];
  if (y) parts.push(y + (y === 1 ? ' year' : ' years'));
  if (m || !y) parts.push(m + (m === 1 ? ' month' : ' months'));
  return parts.join(' ');
}

// All derived (not stored) pricing/risk figures. Duration and the price-move
// estimate use a simplified approximation, not a full cash-flow model — fine
// for an illustrative fact sheet, not for real trading decisions.
function bondMetrics(a){
  var perUnitCoupon = round2(PAR * (a.rateNum / 100) / 2);   // semi-annual on every current offering
  var currentYield = round2(a.rateNum * 100 / a.price);
  var ytm = round2((a.rateNum + (100 - a.price) / a.years) / ((100 + a.price) / 2) * 100);
  var duration = Math.round(a.years * 0.88 * 10) / 10;
  return {
    priceStatus: a.price > 100 ? 'Premium' : a.price < 100 ? 'Discount' : 'At par',
    perUnitCoupon: perUnitCoupon,
    currentYield: currentYield,
    ytm: ytm,
    ytc: a.callable ? null : 'N/A — not callable',
    accruedPerUnit: round2(accruedPerToken(a.id)),
    duration: duration,
    priceChangePer1pct: round2(duration * a.price / 100)
  };
}

function plainLanguageSummary(a, m){
  var verb = a.shariah ? 'invest' : 'lend';
  var back = a.shariah ? 'your RM100 principal is returned' : 'your RM100 is repaid';
  return 'You ' + verb + ' RM100 per unit in ' + a.name + ' and receive ' + rm(m.perUnitCoupon) +
    ' every 6 months until ' + a.maturity + ', when ' + back + ' — assuming the issuer does not default.';
}

// Grouped [label, value] pairs — rendered as the explainer's fact-sheet card
// AND sent verbatim to /api/ask, so the live chat is grounded in exactly what
// the person on screen can already see.
function explainerFacts(a){
  var m = bondMetrics(a);
  return {
    identity: [
      ['Bond name', a.name],
      ['Issuer', a.name],
      ['Issuer type', a.issuerType],
      ['Currency', a.currency]
    ],
    coreTerms: [
      ['Face value (par)', 'RM100 per unit'],
      ['Coupon rate', a.rate],
      ['Coupon type', a.couponType],
      ['Coupon frequency', 'Semi-annual'],
      ['Issue date', a.issueDate],
      ['Maturity date', a.maturity],
      ['Time to maturity', daysToYearsMonths(daysToMaturity(a))]
    ],
    pricing: [
      ['Current market price', a.price.toFixed(2) + '% of par'],
      ['Price status', m.priceStatus],
      ['Current yield', m.currentYield.toFixed(2) + '%'],
      ['Yield to maturity (approx.)', m.ytm.toFixed(2) + '%'],
      ['Yield to call', m.ytc || (a.callable ? 'Callable — see call terms' : 'N/A — not callable')],
      ['Accrued interest since last coupon', rm(m.accruedPerUnit) + ' / unit'],
      ['Next coupon date', payoutLabel(nextPayoutOf(a.id))],
      ['Next coupon amount', rm(m.perUnitCoupon) + ' / unit']
    ],
    risk: [
      ['Credit rating', a.rating],
      ['Duration (approx.)', m.duration + ' years'],
      ['Est. price move per 1% rate change', '≈ ' + rm(m.priceChangePer1pct) + ' / unit (approx.)'],
      ['Callable', a.callable ? 'Yes' : 'No'],
      ['Seniority', a.seniority]
    ],
    context: [
      ['Sector', a.sector],
      ['Country', a.country],
      ['Issue size', a.issueSize]
    ],
    summary: plainLanguageSummary(a, m),
    footer: 'Data as at ' + longDate(today()) + ' · issuer disclosures and rating agency data. Educational information only — not investment advice.'
  };
}

function portfolio(){
  var ids = heldIds();
  var value = 0, cost = 0, weighted = 0, projected = 0;

  ids.forEach(function(id){
    var a = assetById(id);
    value += positionValue(id);
    cost  += positionCost(id);
    weighted  += positionCost(id) * a.rateNum;
    projected += positionCost(id) * (a.rateNum / 100) * a.years;
  });

  // Next distribution: the soonest payout date among held positions, and the
  // total landing on that date.
  var nextIso = null;
  ids.forEach(function(id){
    var iso = nextPayoutOf(id);
    if (!nextIso || iso < nextIso) nextIso = iso;
  });
  var nextAmount = 0;
  if (nextIso) {
    ids.forEach(function(id){
      if (nextPayoutOf(id) === nextIso) nextAmount += semiAnnualPayout(id);
    });
  }
  var nextNames = ids
    .filter(function(id){ return nextPayoutOf(id) === nextIso; })
    .map(function(id){ return assetById(id).short; });

  var unrealised = value - cost;
  var earned = unrealised + book.distributions;   // capital gain + income received

  return {
    ids: ids,
    positions: ids.length,
    value: round2(value),
    cost: round2(cost),
    unrealised: round2(unrealised),
    earned: round2(earned),
    // Return on money actually put in, i.e. value net of what it has earned.
    deltaPct: cost > 0 ? (earned / (value - earned)) * 100 : 0,
    weightedYield: cost > 0 ? weighted / cost : 0,
    projected: round2(projected),
    nextIso: nextIso,
    nextAmount: round2(nextAmount),
    nextNames: nextNames,
    nextDays: nextIso ? daysUntil(nextIso) : 0
  };
}

/* ── transactions ─────────────────────────────────────────────── */

function logActivity(entry){
  entry.date = shortDate(new Date());
  book.activity.unshift(entry);
  if (book.activity.length > 40) book.activity.length = 40;
}

function buyTokens(id, amount){
  var tokens = amount / PAR;
  var fee = round2(amount * TRADE_FEE);
  var total = round2(amount + fee);
  book.wallet = round2(book.wallet - total);
  book.holdings[id] = tokensOf(id) + tokens;
  logActivity({ glyph:'↑', kind:'buy', title:'Bought ' + tokens + ' unit' + (tokens===1?'':'s'),
                sub: assetById(id).name + ' · incl. ' + rm(fee) + ' fee', amount: -total });
  saveBook();
}

function sellTokens(id, qty){
  var q = sellQuote(id, qty);
  book.wallet = round2(book.wallet + q.net);
  book.holdings[id] = tokensOf(id) - qty;
  if (book.holdings[id] <= 0) delete book.holdings[id];
  logActivity({ glyph:'↑', kind:'sell', title:'Sold ' + qty + ' unit' + (qty===1?'':'s'),
                sub: assetById(id).name, amount: q.net });
  saveBook();
  return q;
}

function sellQuote(id, qty){
  var a = assetById(id);
  var gross = round2(qty * a.price);
  var fee = round2(gross * TRADE_FEE);
  var accrued = round2(qty * accruedPerToken(id));
  return { price:a.price, gross:gross, fee:fee, accrued:accrued, net: round2(gross - fee + accrued) };
}

function topUp(amount){
  book.wallet = round2(book.wallet + amount);
  logActivity({ glyph:'+', kind:'top', title:'Balance top-up',
                sub:'DuitNow · Maybank Islamic ••4412', amount: amount });
  saveBook();
}

function withdraw(amount){
  book.wallet = round2(book.wallet - amount);
  logActivity({ glyph:'−', kind:'out', title:'Withdrawal to bank',
                sub:'Maybank Islamic ••4412 · 1 business day', amount: -amount });
  saveBook();
}

   Derived view values
   ═══════════════════════════════════════════════════════════════ */

function derive(){
  var a = asset();
  var p = portfolio();
  var amt = parseInt(state.amount, 10) || 0;
  // The 1% fee is charged on top of the subscription, so the balance has to
  // cover both — not just the units.
  var fee = round2(amt * TRADE_FEE);
  var total = round2(amt + fee);
  var valid = amt >= 100 && amt % 100 === 0 && total <= book.wallet;

  var list = ASSETS.slice();
  if (state.shariahOnly) list = list.filter(function(x){ return x.shariah; });
  if (state.filter === 'Shariah')     list = list.filter(function(x){ return x.shariah; });
  if (state.filter === 'Sukuk')       list = list.filter(function(x){ return x.kind === 'SUKUK'; });
  if (state.filter === 'Bonds')       list = list.filter(function(x){ return x.kind === 'BOND'; });
  if (state.filter === 'SRI / Green') list = list.filter(function(x){ return x.green; });
  if (state.filter === 'Rated only')  list = list.filter(function(x){ return x.rated; });
  list = list.sort(function(x,y){ return y.rateNum - x.rateNum; });

  return {
    a:a, p:p, amt:amt, fee:fee, total:total, valid:valid,
    income: round2(amt * a.rateNum / 100 * a.years),
    list:list,
    owns: tokensOf(a.id) > 0,
    buyHint: amt < 100 ? 'Minimum investment is RM100'
           : amt % 100 !== 0 ? 'Invested in RM100 units'
           : total > book.wallet ? 'With the ' + TRADE_FEE_LABEL + ' fee that is ' + rm(total) + ' — exceeds your ' + rm(book.wallet)
           : 'Available: ' + rm(book.wallet) + ' · ' + TRADE_FEE_LABEL + ' fee ' + rm(fee)
  };
}

function heroData(p){
  var hidden = state.hide;
  var sign = p.earned >= 0 ? '+' : '−';
  var map = {
    'Total value': {
      label:'Portfolio value',
      value: hidden ? 'RM ••••••' : rm(p.value),
      delta: sign + Math.abs(p.deltaPct).toFixed(2) + '%',
      sub: rm(Math.abs(p.earned)) + (p.earned >= 0 ? ' earned' : ' lost') + ' since Mar 2025'
    },
    'Projected income': {
      label:'Projected income to maturity',
      value: hidden ? 'RM ••••••' : rm(p.projected),
      delta: p.weightedYield.toFixed(2) + '% p.a.',
      sub:'across ' + p.positions + ' position' + (p.positions===1?'':'s') + ', if held to maturity'
    },
    'Next payout': {
      label:'Next distribution',
      value: hidden ? 'RM ••••' : rm(p.nextAmount),
      delta: p.nextIso ? shortDate(new Date(p.nextIso + 'T00:00:00')) : '—',
      sub: p.nextNames.length ? p.nextNames.join(' + ') : 'no positions held'
    }
  };
  return map[state.heroMetric] || map['Total value'];
}

  if (state.screen === null){

    if (state.tab === 'activity') body = activityScreen();
    if (state.tab === 'profile')  body = profileScreen();
  }
  else if (state.screen === 'detail')        body = detailScreen(d);
  else if (state.screen === 'buy')           body = buyScreen(d);
  else if (state.screen === 'sell')          body = sellScreen(d);
  else if (state.screen === 'done')          body = doneScreen(d);
  else if (state.screen === 'notifications') body = notificationsScreen();

  var out = '<div id="scroll" class="scroll">' + body + '</div>';

function downloadTextFile(filename, text){
  var blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ═══════════════════════════════════════════════════════════════
   Chat — talks to /api/ask, falls back to canned answers offline
   ═══════════════════════════════════════════════════════════════ */

function splitCite(text){
  // The model is asked to end with a line starting "SOURCE:".
  var m = text.match(/\n\s*SOURCE:\s*([\s\S]*)$/i);
  if (!m) return { body: text.trim(), cite: null };
  return { body: text.slice(0, m.index).trim(), cite: 'Sources: ' + m[1].trim() };
}

function apiMessages(){
  // The API requires the first message to be from the user, so drop the
  // opening assistant greeting.
  var out = [];
  state.messages.forEach(function(m){
    if (out.length === 0 && m.role !== 'user') return;
    out.push({ role: m.role === 'user' ? 'user' : 'assistant', text: m.text });
  });
  return out;
}

function cannedFor(question){
  for (var i = 0; i < QA.length; i++) {
    if (QA[i].q.toLowerCase() === question.trim().toLowerCase()) return QA[i];
  }
  return null;
}

function ask(question){
  var q = (question || '').trim();
  if (!q || state.thinking || state.streaming) return;

  state.messages = state.messages.concat([{ role:'user', text:q, cite:null }]);
  state.thinking = true;
  state.streaming = '';
  state.chatError = null;
  pendingMsgScroll = true;
  render();

  var a = asset();
  var payload = {
    // Minimal identity the server needs for its own logic (grounding check,
    // KPI callout). Everything else the model should know is in `facts` —
    // the same data already rendered on screen, so answers stay consistent
    // with what the person is looking at.
    asset: { id:a.id, name:a.name, short:a.short, hasKpi:a.hasKpi },
    facts: explainerFacts(a),
    messages: apiMessages()
  };

  chatAbort = new AbortController();

  fetch('/api/ask', {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify(payload),
    signal: chatAbort.signal
  }).then(function(res){
    if (!res.ok || !res.body) throw new Error('server returned ' + res.status);
    return readStream(res.body.getReader(), q);
  }).catch(function(err){
    if (err && err.name === 'AbortError') return;
    finishWithFallback(q, err);
  });
}

function readStream(reader, question){
  var decoder = new TextDecoder();
  var buffer = '';

  function pump(){
    return reader.read().then(function(r){
      if (r.done) { finishStream(question); return; }
      buffer += decoder.decode(r.value, { stream:true });

      var parts = buffer.split('\n\n');
      buffer = parts.pop();

      parts.forEach(function(part){
        var line = part.split('\n').find(function(l){ return l.indexOf('data: ') === 0; });
        if (!line) return;
        var ev;
        try { ev = JSON.parse(line.slice(6)); } catch (e) { return; }

        if (ev.type === 'delta') {
          if (state.thinking) { state.thinking = false; state.streaming = ev.text; render(); }
          else { state.streaming += ev.text; patchStream(); }
        } else if (ev.type === 'error') {
          state.chatError = ev.message;
        }
      });

      return pump();
    });
  }
  return pump();
}

// Update the live bubble in place — a full re-render per token would thrash.
function patchStream(){
  var el = document.getElementById('streamText');
  if (el) {
    el.textContent = state.streaming;
    var msgs = document.getElementById('msgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  } else {
    render();
  }
}

function finishStream(question){
  var text = state.streaming;
  state.thinking = false;
  state.streaming = '';
  chatAbort = null;

  if (text) {
    var split = splitCite(text);
    state.messages = state.messages.concat([{ role:'ai', text:split.body, cite:split.cite }]);
    state.chatError = null;
  } else {
    // Live answer didn't come through. Fall back to a saved answer with no
    // technical explanation — the person asking doesn't need to know why.
    var canned = cannedFor(question);
    if (canned) {
      state.messages = state.messages.concat([{ role:'ai', text:canned.a, cite:canned.c }]);
      state.chatError = null;
    } else {
      state.chatError = "I don't have a saved answer for that one — try one of the suggested questions below, or ask about the rate, maturity, security, or risks.";
    }
  }
  pendingMsgScroll = true;
  render();
}

// Server unreachable (e.g. index.html opened straight from disk): use the
// canned answer if we have one, otherwise a plain, non-technical nudge.
function finishWithFallback(question, err){
  state.thinking = false;
  state.streaming = '';
  chatAbort = null;

  var canned = cannedFor(question);
  if (canned) {
    state.messages = state.messages.concat([{ role:'ai', text:canned.a, cite:canned.c }]);
    state.chatError = null;
  } else {
    state.chatError = "I don't have a saved answer for that one — try one of the suggested questions below, or ask about the rate, maturity, security, or risks.";
  }
  pendingMsgScroll = true;
  render();
}

function sendFromInput(){
  var el = document.getElementById('chatInput');
  if (!el) return;
  var v = el.value;
  el.value = '';
  ask(v);
}

/* ═══════════════════════════════════════════════════════════════
   Actions
   ═══════════════════════════════════════════════════════════════ */

function keyEdit(current, k, maxLen){
  var a = current;
  if (k === '⌫') a = a.length > 1 ? a.slice(0, -1) : '0';
  else if (k === '00') a = a === '0' ? '0' : a + '00';
  else a = a === '0' ? k : a + k;
  if (a.length > maxLen) a = a.slice(0, maxLen);
  return a;
}

var actions = {
  back: back,
  pickTab: function(id){ goTab(id); },
  goProfile:  function(){ goTab('profile'); },
  goMarket:   function(){ goTab('market'); },
  goWallet:   function(){ goTab('wallet'); },
  goActivity: function(){ goTab('activity'); },
  goHome:     function(){ setState({ tab:'home', screen:null, stack:[], buyStep:'entry', ack:false, explainer:false, doneRows:null, doneMeta:null }); },
  goNotifications: function(){ push('notifications'); },
  openAsset:  function(id){ openAsset(id); },
  openFeatured: function(){ openAsset('gl'); },
  goBuy:  function(){ push('buy', { buyStep:'entry' }); },
  goSell: function(){ push('sell', { sellQty: tokensOf(asset().id) || 1 }); },   // defaults to selling the full holding
  sellAll: function(){ setState({ sellQty: tokensOf(asset().id) || 1 }); },

  toggleHide: function(){ setState({ hide: !state.hide }); },
  cycleHero:  function(){
    var i = HERO_METRICS.indexOf(state.heroMetric);
    setState({ heroMetric: HERO_METRICS[(i + 1) % HERO_METRICS.length] });
  },
  toggleShariah: function(){ setState({ shariahOnly: !state.shariahOnly }); },
  resetDemo: function(){
    resetBook();
    setState({ tab:'home', screen:null, stack:[], filter:'All', amount:'500', sellQty:12, hide:false, doneMeta:null, cash:null, toast:null });
  },
  dismissToast: function(){
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    setState({ toast:null });
  },
  // Demo-only: fast-forwards the virtual clock to the soonest upcoming payout
  // across your holdings and lets checkAndCreditDistributions() do the actual
  // crediting — there is no "claim" step, this only skips the calendar wait.
  simulateNextPayout: function(){
    var ids = heldIds();
    if (!ids.length) { showToast('No holdings', 'You need an active position to receive a distribution.'); return; }
    var soonest = null;
    ids.forEach(function(id){ var iso = nextPayoutOf(id); if (!soonest || iso < soonest) soonest = iso; });
    var targetMs = new Date(soonest + 'T00:00:00').getTime() - Date.now();
    book.clockOffsetMs = Math.max(book.clockOffsetMs, targetMs);
    var credited = checkAndCreditDistributions();
    saveBook();
    if (credited.length) {
      var total = round2(credited.reduce(function(s, c){ return s + c.amount; }, 0));
      var names = credited.map(function(c){ return c.name; }).join(', ');
      showToast('Distribution received', rm(total) + ' from ' + names + ' has landed in your balance.');
    } else {
      render();
    }
  },
  pickFilter: function(label){ setState({ filter: label }); },

  /* buy */
  tapKey: function(k){ setState({ amount: keyEdit(state.amount, k, 6) }); },
  quickAmount: function(v){ setState({ amount: String(v) }); },
  toReview: function(){ if (derive().valid) setState({ buyStep:'review' }); },
  toggleAck: function(){ setState({ ack: !state.ack }); },
  confirmBuy: function(){
    if (!state.ack) return;
    var d = derive();
    if (!d.valid) return;
    buyTokens(d.a.id, d.amt);
    setState({
      screen:'done', doneKind:'buy', stack:[], explainer:false,
      doneRows:[['Instrument', d.a.code], ['Units', String(d.amt/100)], ['Fee (' + TRADE_FEE_LABEL + ')', rm(d.fee)], ['Debited', rm(d.total)], ['Reference','TKN-8820-BY']]
    });
  },

  /* sell */
  confirmSell: function(){
    var a = asset();
    var qty = Math.min(state.sellQty, tokensOf(a.id));
    if (qty < 1) return;
    var q = sellTokens(a.id, qty);
    var settle = new Date(); settle.setDate(settle.getDate() + 1);
    setState({
      screen:'done', doneKind:'sell', stack:[], explainer:false,
      doneMeta:{ net:q.net },
      doneRows:[['Units sold', String(qty)], ['Proceeds', rm(q.net)], ['Settlement', 'T+1 · ' + longDate(settle)], ['Reference','TKN-4471-SD']]
    });
  },

  /* cash */
  openTopUp:    function(){ setState({ cash:{ mode:'topup', amount:'0' } }); },
  openWithdraw: function(){ setState({ cash:{ mode:'withdraw', amount:'0' } }); },
  closeCash:    function(){ setState({ cash:null }); },
  cashKey:      function(k){ setState({ cash:{ mode:state.cash.mode, amount: keyEdit(state.cash.amount, k, 6) } }); },
  cashQuick:    function(v){
    var amount = v === 'all' ? String(Math.floor(book.wallet)) : String(v);
    setState({ cash:{ mode:state.cash.mode, amount: amount } });
  },
  confirmCash: function(){
    var mode = state.cash.mode;
    var amt = parseInt(state.cash.amount, 10) || 0;
    if (amt < 10) return;
    if (mode === 'withdraw' && amt > book.wallet) return;
    if (mode === 'topup') topUp(amt); else withdraw(amt);
    setState({
      cash:null, screen:'done', doneKind:mode, stack:[], explainer:false,
      doneRows:[[mode === 'topup' ? 'Added' : 'Withdrawn', rm(amt)],
                ['Account','Maybank Islamic ••4412'],
                ['Reference', mode === 'topup' ? 'TKN-2210-TU' : 'TKN-3390-WD']]
    });
  },

  /* explainer */
  openExplainer:  function(){ setState({ explainer:true, chatError:null }); },
  closeExplainer: function(){
    if (chatAbort) { chatAbort.abort(); chatAbort = null; }
    setState({ explainer:false, thinking:false, streaming:'' });
  },
  ask: function(i){ var item = QA[parseInt(i,10)]; if (item) ask(item.q); },
  send: function(){ sendFromInput(); }
};

/* ═══════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════ */

var appEl = document.getElementById('app');
var lastKey = '';

function render(){
  var oldScroll = document.getElementById('scroll');
  var prevTop = oldScroll ? oldScroll.scrollTop : 0;
  var key = state.tab + '|' + state.screen + '|' + state.buyStep;

  var input = document.getElementById('chatInput');
  var caretValue = input ? input.value : null;
  var hadFocus = input && document.activeElement === input;

  appEl.innerHTML = view();

  var sc = document.getElementById('scroll');
  if (sc) sc.scrollTop = (key === lastKey) ? prevTop : 0;
  lastKey = key;

  var msgs = document.getElementById('msgs');
  if (msgs && pendingMsgScroll){ msgs.scrollTop = msgs.scrollHeight; pendingMsgScroll = false; }

  var range = document.getElementById('sellRange');
  if (range) range.addEventListener('input', onSellInput);

  var newInput = document.getElementById('chatInput');
  if (newInput){
    if (caretValue) newInput.value = caretValue;
    if (hadFocus && !newInput.disabled) newInput.focus();
    newInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); sendFromInput(); }
    });
  }
}

/* Slider patches in place so a mouse drag is never interrupted by a re-render. */
function onSellInput(e){
  state.sellQty = parseInt(e.target.value, 10);
  var q = sellQuote(asset().id, state.sellQty);
  setText('sellQty', String(state.sellQty));
  setText('sellGross', rm(q.gross));
  setText('sellAccrued', '+' + rm(q.accrued));
  setText('sellFee', '−' + rm(q.fee));
  setText('sellNet', rm(q.net));
  setText('sellCta', 'Sell ' + state.sellQty + ' units for ' + rm(q.net));
}
function setText(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }

appEl.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || !appEl.contains(el)) return;
  var fn = actions[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-arg'));
});

// Whatever real time actually passed since the last visit may have carried a
// payout date — credit it automatically, same as the demo fast-forward does.
(function(){
  var credited = checkAndCreditDistributions();
  if (credited.length) {
    var total = round2(credited.reduce(function(s, c){ return s + c.amount; }, 0));
    var names = credited.map(function(c){ return c.name; }).join(', ');
    showToast('Distribution received', rm(total) + ' from ' + names + ' has landed in your balance.');
  } else {
    render();
  }
})();
</script>
